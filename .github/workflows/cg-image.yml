# Fork-only: builds the patched Outline image for the c-lgrant homelab and
# pushes it to GHCR. Upstream workflows are untouched.
name: cg image

on:
  push:
    branches: ["cg/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cg-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    if: github.repository == 'c-lgrant/outline'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Build base image
        run: docker build -f Dockerfile.base -t outline-base:ci .

      - name: Build runtime image
        run: docker build -f Dockerfile --build-arg BASE_IMAGE=outline-base:ci -t outline:ci .

      - name: Push to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(jq -r .version package.json)
          image=ghcr.io/${{ github.repository_owner }}/outline
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in "${version}-cg.${{ github.run_number }}" "${version}-cg"; do
            docker tag outline:ci "$image:$tag"
            docker push "$image:$tag"
          done
          echo "Pushed $image:${version}-cg.${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
